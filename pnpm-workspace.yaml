# Security overrides. They live here, not in package.json: pnpm >= 11 no longer
# reads the `pnpm` field of package.json at all (pnpm 12.4.1 warns "The following
# keys were ignored: pnpm.overrides"), so an upgrade would drop every one of these
# from the deployed tree without failing anything.
