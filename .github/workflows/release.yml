name: Release (auto version + tag)

# Every merge to main bumps the MINOR version by 0.1.0 and pushes a matching
# vX.Y.0 annotated tag + GitHub Release. This is the org versioning policy
# (nyuchi/.github#80): a release to main is a MINOR, a merge into staging is a
# PATCH (staging-version.yml), and a MAJOR is only ever made by hand: run this
# workflow from the Actions tab with bump: major. Each segment holds 0..999;
# minor 999 stops and asks for that manual major. The next version comes from
# the shared next-version action, pinned below. Authors only add a `## [x.y.0]` section
# to CHANGELOG.md in their PR; CI owns the VERSION file and the tag.
# GATED ON CI, not on the push. This used to trigger on `push: branches: [main]`,
# which cut a version, an annotated tag and a GitHub Release on EVERY merge —
# whether or not the tests passed. That is not theoretical: v4.28.0 and v4.29.0
# were both released off a `main` whose latest CI run had failed the coverage
# gate, and because the bot's own commit carries `[skip ci]` the release commit
# is never checked either, so `main` was left with no green verdict at all while
# still shipping tagged releases.
#
# `workflow_run` fires only after the test workflow COMPLETES, and the `if` below
# admits only a successful conclusion. A red `main` now gets no tag and no
# release — the version numbers go back to meaning "this was verified".
#
# Self-triggering is prevented twice over: the release commit carries `[skip ci]`
# so the test workflow never runs on it (hence no `workflow_run` to chain from),
# and the `chore(release):` guard below still holds independently of that.
on:
  workflow_run:
    workflows: ["Test & Deploy Mukoko News"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Bump for this release. major is only ever made by hand, here.
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    # Two conditions, both required.
    #   1. The test workflow must have SUCCEEDED. `workflow_run` fires on every
    #      completion — failure, cancelled and timed_out included — so without
    #      this the gate would be decorative.
    #   2. The bot's own release commit is skipped so it cannot trigger itself.
    # `github.event.head_commit` does not exist on a `workflow_run` event; the
    # triggering commit is under `github.event.workflow_run.head_commit`.
    #   A manual run (workflow_dispatch) is a person's release and skips both.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
      && !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true # checkout does NOT fetch tags by default even with depth 0
          ref: main # tip of main (not the trigger SHA) so rapid merges don't tag a stale commit
          # Org-wide release PAT so the push to a protected `main` and the tag/release
          # are allowed (the default GITHUB_TOKEN can't bypass branch protection).
          # Set the org secret name here if it differs from RELEASE_BUMP_TOKEN.
          token: ${{ secrets.RELEASE_BUMP_TOKEN }}

      - name: Is this the first release?
        id: latest
        run: |
          set -euo pipefail
          # Query the REMOTE for tags (robust regardless of what checkout fetched).
          # Captured first: `ls-remote | grep -q` under pipefail fails on the
          # SIGPIPE when grep exits early, which read as "no tags".
          tags="$(git ls-remote --tags --refs origin 'v*')"
          if grep -qE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tags"; then
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version (org versioning policy)
        id: policy
        if: steps.latest.outputs.bootstrap != 'true'
        uses: nyuchi/.github/.github/actions/next-version@de909ab7468d998ba2cf87416ac2042616eba75d  # main, 2026-10-04
        with:
          channel: main
          bump: ${{ inputs.bump || '' }}
          manual: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Resolve version
        id: v
        env:
          BOOTSTRAP: ${{ steps.latest.outputs.bootstrap }}
          NEXT: ${{ steps.policy.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$BOOTSTRAP" = "true" ]; then
            # Bootstrap: the FIRST release tags the current VERSION file as-is (no bump).
            NEW="$(cat VERSION 2>/dev/null || echo '0.1.0')"
          else
            NEW="$NEXT"
          fi
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Next version: v$NEW"

      - name: Tag + bump VERSION + release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BUMP_TOKEN }}
          NEW: ${{ steps.v.outputs.new }}
        run: |
          set -euo pipefail
          # Existence check against the REMOTE (a prior run's tag may not be local).
          if git ls-remote --tags --refs origin "v$NEW" | grep -q .; then
            echo "Tag v$NEW already exists on origin — nothing to do."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bump VERSION on main (if it changed), with a rebase-retry against a
          # concurrent release commit from a near-simultaneous merge.
          if [ "$(cat VERSION 2>/dev/null || true)" != "$NEW" ]; then
            echo "$NEW" > VERSION
            git add VERSION
            git commit -m "chore(release): v$NEW [skip ci]"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=true; break; fi
              git pull --rebase origin main || true
              sleep $((attempt * 2))
            done
            [ "$pushed" = true ] || { echo "Failed to push VERSION bump to main." >&2; exit 1; }
          fi

          # ANNOTATED tag pushed EXPLICITLY (a lightweight tag would be skipped by
          # --follow-tags and never reach the remote — the whole point of this job).
          git tag -a "v$NEW" -m "v$NEW"
          git push origin "v$NEW"

          # Create the release only if it doesn't already exist — don't blanket-swallow
          # real failures (auth/network) into a green run with no release.
          if ! gh release view "v$NEW" >/dev/null 2>&1; then
            gh release create "v$NEW" --title "v$NEW" --generate-notes
          fi
