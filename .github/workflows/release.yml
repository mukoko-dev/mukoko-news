name: Release

# Releasing is a merge to main; nobody pushes a tag by hand. When the
# "Test & Deploy Mukoko News" workflow passes on a push to main, this reads
# the VERSION file and, if `v<version>` is not tagged yet, tags the
# CI-validated commit and publishes a GitHub release (generated notes), using
# the RELEASE_BUMP_TOKEN org secret. A merge that does not change VERSION
# finds its tag already there and does nothing.
#
# Versioning policy (nyuchi/.github#80): a release to main is the next
# MINOR above the highest tag, and VERSION must say so (the run fails and
# names the right version otherwise); merges into staging are tagged as
# patches by staging-version.yml. A MAJOR only by hand: merge VERSION=X.0.0
# to main (the automatic run then fails the policy check), then run this
# workflow from the Actions tab on `main` with bump: major. Each segment
# holds 0..999. A manual run on any branch other than main does nothing, so
# a release can never be tagged on a staging commit.
#
# The staging -> main release PR carries the VERSION bump and its
# `## [x.y.0]` CHANGELOG section. This job no longer commits to main.
#
# The logic is nyuchi/.github's reusable-auto-tag.yml.

on:
  workflow_run:
    workflows: ["Test & Deploy Mukoko News"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Versioning policy override. main releases the next minor; a major
          is only ever made by hand, here.
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: read

jobs:
  tag:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    uses: nyuchi/.github/.github/workflows/reusable-auto-tag.yml@924e5b4d0983d31379aedbec02b990793f29c792 # main, 2026-10-04
    with:
      version-command: cat VERSION
      channel: main
      bump: ${{ inputs.bump || '' }}
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      create-release: true
    secrets:
      token: ${{ secrets.RELEASE_BUMP_TOKEN }}
