name: Test & Deploy Mukoko News

on:
  push:
    branches: [ main ]
  # No `branches:` filter on pull_request, deliberately. Filtering to `main`
  # meant a PR based on ANOTHER PR never ran test or build — measured on this
  # repo, three stacked PRs sat at two checks each (claude-review and a Vercel
  # status) for a full CI window and were merge-ready on nobody's evidence.
  #
  # That is the same failure as a check that reports green without asserting
  # anything: the list looks complete while the tests it implies never ran. A
  # stacked PR is where review attention is thinnest, so it is the worst place
  # to have no gate. Every PR now runs, whatever it is based on; the
  # concurrency group below keeps the extra runs cheap.
  pull_request:

# The jobs below now run in parallel rather than in a chain, which means a push
# starts nine of them at once. Cancel a superseded in-flight run so that costs
# queue time rather than wall-clock. Never on `main`: that ref's run is what
# reports deployable state, and cancelling it half-way leaves a commit with no
# verdict at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Node version defined ONCE and referenced by every job below. Five jobs each
# carried their own hardcoded Node 20 pin, which is how a repo ends up
# with jobs on different majors without anyone deciding to. 24 is Active LTS —
# deliberately not the minimum a toolchain will accept, because sitting on the
# bottom threshold is what produces "requires at least Node vX" failures the
# moment any tool moves its floor.
env:
  NODE_VERSION: '24'

permissions:
  contents: read
  pull-requests: read
  # `vercel/repository-dispatch/actions/status` posts a commit status
  # (statuses: write) and reads this run's job/step conclusions to decide
  # success vs failure (actions: read). Without both it fails at the post step,
  # after the real check has already passed — a confusing way to break CI.
  statuses: write
  actions: read

jobs:
  # ── Repo hygiene linters (file/format checks) ──────────────────────────────
  # These five matrix entries are the branch-protection required checks
  # (lint / actionlint, lint / JSON validity, lint / prettier, …). Keep their
  # names stable so the org ruleset keeps matching them.
  lint:
    runs-on: ubuntu-latest
    name: lint / ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        check: [actionlint, "JSON validity", prettier, markdownlint, yamllint]

    steps:
    # Reports this check to Vercel as a named commit status.
    #
    # MUST be the first step. The action registers a `post` hook, and the hook is
    # what actually reports the outcome: it scans this job's steps for a failure
    # once they have all run. A step that is never reached never registers its
    # post hook, so placing this at the end would report nothing in exactly the
    # case that matters — a failing check.
    #
    # KNOWN LIMIT on `pull_request` runs: the action takes the commit from
    # GITHUB_SHA, which on that event is the ephemeral merge commit
    # (refs/pull/N/merge) rather than the PR head, so the status lands on a
    # commit GitHub does not display. Measured twice — run 34425929192 wrote to
    # 18e10b1 for head 92b65cf, run 34426047263 to 76b1e4b for head f5e08ad.
    # It cannot be redirected: the action exposes no `sha` input, and GitHub
    # documents that "you can't overwrite the value of the default environment
    # variables named GITHUB_* and RUNNER_*", so setting GITHUB_SHA here is
    # silently ignored (tried; it is why that second measurement exists).
    # Push runs are unaffected — there GITHUB_SHA is the real commit.
    - name: Notify Vercel
      uses: vercel/repository-dispatch/actions/status@v1
      with:
        name: 'Vercel - mukoko-news: lint / ${{ matrix.check }}'

    - uses: actions/checkout@v4

    - name: Run actionlint
      if: matrix.check == 'actionlint'
      uses: raven-actions/actionlint@v2

    - name: Validate JSON files
      if: matrix.check == 'JSON validity'
      run: |
        find . \
          -name "*.json" \
          -not -path "*/node_modules/*" \
          -not -path "*/.git/*" \
          -not -path "*/.next/*" \
          -not -path "*/.wrangler/*" \
          -not -path "*/.venv/*" \
          -not -path "*/dist/*" \
          | while read -r f; do
              python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
            done

    - name: Setup Node.js
      if: matrix.check == 'prettier'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Run prettier
      if: matrix.check == 'prettier'
      run: |
        npm install --no-save prettier@3
        npx prettier --check "**/*.json"

    - name: Run markdownlint
      if: matrix.check == 'markdownlint'
      uses: DavidAnson/markdownlint-cli2-action@v16
      with:
        globs: "**/*.md"

    - name: Run yamllint
      if: matrix.check == 'yamllint'
      run: |
        pip install yamllint
        yamllint -c .yamllint.yml .

  # ── Frontend pipeline ──────────────────────────────────────────────────────
  # These four ran chained — ESLint -> Typecheck -> Test -> Build, each `needs:`
  # the last. The chain was not buying ordering that anything relied on: none of
  # these jobs consumes another's output, they each check out and `npm ci` from
  # scratch. What it bought was a run that could only ever report ONE failure,
  # because the first red stage skipped the other three. A lint slip hid whether
  # the tests passed; a test failure hid whether it even builds.
  #
  # They are independent now, so one run tells you everything that is wrong.
  # Job NAMES are unchanged on purpose — the org ruleset's required checks and
  # the Vercel commit statuses both match on them.
  eslint:
    runs-on: ubuntu-latest
    name: ESLint
    steps:
    - name: Notify Vercel
      uses: vercel/repository-dispatch/actions/status@v1
      with:
        name: 'Vercel - mukoko-news: ESLint'

    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - run: npm ci
    - name: Run ESLint
      run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    name: Typecheck
    steps:
    - name: Notify Vercel
      uses: vercel/repository-dispatch/actions/status@v1
      with:
        name: 'Vercel - mukoko-news: Typecheck'

    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - run: npm ci
    - name: Run tsc --noEmit
      run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
    - name: Notify Vercel
      uses: vercel/repository-dispatch/actions/status@v1
      with:
        name: 'Vercel - mukoko-news: Test'

    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - run: npm ci
    # `npm run test:coverage`, not `npm run test`. The coverage thresholds in
    # vitest.config.ts have existed for a long time and CI never ran the script
    # that enforces them, so they gated nothing. (`@vitest/coverage-v8` was not
    # even installed — the script could not have run.)
    - name: Run Vitest with coverage
      run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
    - name: Notify Vercel
      uses: vercel/repository-dispatch/actions/status@v1
      with:
        name: 'Vercel - mukoko-news: Build'

    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - run: npm ci
    - name: Build Next.js
      run: npm run build
