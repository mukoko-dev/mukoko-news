version: 2
updates:
  - package-ecosystem: "npm"
    target-branch: "staging"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait seven days after a release before proposing it, as the org
    # repositories do: most compromised releases are pulled within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "bryanfawcett"
