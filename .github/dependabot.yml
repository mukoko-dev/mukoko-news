version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait seven days after a release before proposing it, as the org
    # repositories do: most compromised releases are pulled within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "bryanfawcett"
    ignore:
      # Until Astro and typescript-eslint support TS 7; remove then.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
